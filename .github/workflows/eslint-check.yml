name: ESLint Check

on:
  pull_request:
    branches:
      - '**'

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 1: Capture the runner's Node.js version
      - name: Get Node.js version
        id: node_version
        run: echo "version=$(node -v | sed 's/v//')" >> $GITHUB_OUTPUT

      # Step 2: Setup Node.js using that version
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ steps.node_version.outputs.version }}

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run ESLint
      - name: Run ESLint
        run: npm run lint