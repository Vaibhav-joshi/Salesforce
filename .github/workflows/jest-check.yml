name: Jest Check

on:
  workflow_call:
  workflow_dispatch: # optional manual trigger

jobs:
  jest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 1: Capture the runner's Node.js version
      - name: Get Node.js version
        id: node_version
        run: echo "version=$(node -v | sed 's/v//')" >> $GITHUB_OUTPUT

      # Step 2: Setup Node.js using that version
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ steps.node_version.outputs.version }}

      - name: Install dependencies
        run: npm install # or npm ci if you have package-lock.json

      # Step 3: Run Jest tests
      - name: Run Jest tests
        run: npm run test:unit -- --ci
