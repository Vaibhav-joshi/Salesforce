name: Block Direct Commits to dev-int

on:
  push:
    branches:
      - dev-integrated  # Trigger only when someone pushes to dev-int

jobs:
  block-dev-int:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if pushing directly to dev-int
        run: |
          echo "❌ Direct commits/pushes to 'dev-int' are not allowed. Please create a feature branch."
          exit 1