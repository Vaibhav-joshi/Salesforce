name: Enforce Branch Naming Convention

on:
  pull_request:   # Trigger for all PRs, regardless of target branch
    types: [opened, synchronize, reopened]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name against GitHub username (case-insensitive)
        run: |
          echo "Branch being validated: ${{ github.head_ref }}"
          echo "GitHub username: ${{ github.event.pull_request.user.login }}"

          BRANCH_NAME="${{ github.head_ref }}"
          USERNAME="${{ github.event.pull_request.user.login }}"

          # Convert both to lowercase for comparison
          BRANCH_NAME_LOWER=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]')
          USERNAME_LOWER=$(echo "$USERNAME" | tr '[:upper:]' '[:lower:]')

          EXPECTED_PREFIX="feature/${USERNAME_LOWER}/"

          if [[ "$BRANCH_NAME_LOWER" != ${EXPECTED_PREFIX}* ]]; then
            echo "❌ Branch name '$BRANCH_NAME' must start with '${EXPECTED_PREFIX}' (case-insensitive check)"
            exit 1
          fi

          echo "✅ Branch name '$BRANCH_NAME' follows the convention."