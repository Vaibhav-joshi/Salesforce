name: Enforce Branch Naming Convention

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name against GitHub username (normalized)
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          USERNAME="${{ github.event.pull_request.user.login }}"

          # Normalize both: lowercase + replace hyphens with dots
          BRANCH_NAME_NORM=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/-/./g')
          USERNAME_NORM=$(echo "$USERNAME" | tr '[:upper:]' '[:lower:]' | sed 's/-/./g')

          EXPECTED_PREFIX="feature/${USERNAME_NORM}/"

          echo "Normalized branch name: $BRANCH_NAME_NORM"
          echo "Normalized username: $USERNAME_NORM"
          echo "Expected prefix: $EXPECTED_PREFIX"

          # Exemptions: allow dev-integrated, main, release/* without checks
          if [[ "$BRANCH_NAME_NORM" == "dev.integrated" ]] || \
             [[ "$BRANCH_NAME_NORM" == "main" ]] || \
             [[ "$BRANCH_NAME_NORM" == release/* ]]; then
            echo "✅ Branch '$BRANCH_NAME' is exempt from naming convention."
            exit 0
          fi

          # Enforce convention for feature branches
          if [[ "$BRANCH_NAME_NORM" != ${EXPECTED_PREFIX}* ]]; then
            echo "❌ Branch name '$BRANCH_NAME' must start with '${EXPECTED_PREFIX}' (normalized check)"
            exit 1
          fi

          echo "✅ Branch name '$BRANCH_NAME' follows the convention."
